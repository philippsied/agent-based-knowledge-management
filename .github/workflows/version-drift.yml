name: Version Drift Check

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'bin/sync-versions.py'

jobs:
  drift:
    name: plugin.json -> marketplace.json
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Re-run sync-versions and check for drift
        run: |
          cp .claude-plugin/marketplace.json /tmp/marketplace.before.json
          python3 bin/sync-versions.py
          if ! diff -q /tmp/marketplace.before.json .claude-plugin/marketplace.json >/dev/null 2>&1; then
            echo "Version drift detected!"
            echo "Run 'python3 bin/sync-versions.py' locally and commit the result."
            diff /tmp/marketplace.before.json .claude-plugin/marketplace.json || true
            exit 1
          fi
          echo "marketplace.json in sync with plugin.json"
